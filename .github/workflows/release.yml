name: Release

# Publishes to npm via trusted publishing (OIDC) — no tokens, no npm login.
# One-time setup on npmjs.com: package Settings → Trusted Publisher →
# GitHub Actions → repository muhammedogz/netbridge, workflow release.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        # version comes from the packageManager field in package.json

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm ≥ 11.5, required for OIDC trusted publishing.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (cli + ui)
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${PKG}" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
