<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>netbridge</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('netbridge-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="overlay">
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
